name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Image with the page. Only main publishes to GHCR.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/jpsalviano/wedding-invitation:${{ github.sha }}
            ghcr.io/jpsalviano/wedding-invitation:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image and check the page
        if: github.ref == 'refs/heads/main'
        run: |
          docker run -d --name page -p 8080:80 "ghcr.io/jpsalviano/wedding-invitation:${{ github.sha }}"
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then
              curl -fsS http://localhost:8080/casamento/ | grep -q '<title>Gleicimara e João Paulo'
              curl -fsS -o /dev/null http://localhost:8080/casamento/styles.css
              exit 0
            fi
            sleep 1
          done
          docker logs page
          exit 1
