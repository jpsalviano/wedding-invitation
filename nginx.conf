server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css image/svg+xml;

    # Files keep their names between versions: always revalidate, or a change
    # would never arrive.
    location /casamento/ {
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
